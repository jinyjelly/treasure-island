<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>보물섬 탈출 · 제곱근과 실수</title>
<link rel="stylesheet" href="katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 탐험 게임 — 학생이 직접 걸어 다니며 단서를 모으는 해적 모험
   IDEA: 위에서 내려다보는 픽셀 섬. 문 4개가 구역을 막고 있음
   PICTURE: 캔버스 게임 화면이 곧 그림. 해변-정글-어두운 동굴-해골 바위
   COLOUR and TYPE: 바다 청록, 모래, 정글 초록, 산호 강조 / Black Han Sans + Noto Sans KR
   LAYOUT: 상단 제목·타이머, 게임 화면, 아래 방향 패드와 조사·수첩 버튼 */
:root{color-scheme:light dark;--sea:light-dark(#0e5e6f,#072c34);--card:light-dark(#fffaf0,#14272c);--ink:light-dark(#1d2a2c,#eef5f3);--mute:light-dark(#5b6b6d,#9fb6b8);--line:light-dark(#e3d6bd,#2b4a51);--coral:#ff6b4a;--gold:#ffc83d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--sea);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;flex-wrap:wrap}
h1{font:400 clamp(26px,6vw,40px)/1.05 "Black Han Sans",sans-serif;margin:0}
.sub{margin:2px 0 0;color:#bfe3e6;font-size:14px}
.hud{display:flex;gap:8px}
.pill{background:rgba(0,0,0,.28);border-radius:12px;padding:4px 12px;font:400 20px "Black Han Sans",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.game{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);background:#0b3d47;touch-action:none}
canvas{display:block;width:100%}
.prompt{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,20,20,.78);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:600 15px "Noto Sans KR",sans-serif;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.prompt.act{background:var(--coral);cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,20,24,.55);display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:18px 18px 16px;width:min(480px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dlg h2{font:400 24px/1.15 "Black Han Sans",sans-serif;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sym{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#3b2a12;color:var(--gold);font-size:20px}
.dlg p{margin:6px 0}
.big{font-size:26px;text-align:center;margin:10px 0}
.katex{font-size:1.12em}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:800 16px "Noto Sans KR",sans-serif;min-height:46px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;background:#0e5e6f;color:#fff}
button:focus-visible,input:focus{outline:3px solid var(--gold);outline-offset:2px}
button.alt{background:transparent;color:var(--mute);border:2px solid var(--line)}
button.hot{background:var(--coral)}
input{font:600 18px "Noto Sans KR",sans-serif;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);min-height:46px;width:150px}
input.code{letter-spacing:.3em;text-align:center}
.msg{min-height:24px;margin-top:8px;font-size:15px}
.msg.no{color:var(--coral)}.msg.hint{color:var(--mute)}
.note{border-top:1px solid var(--line);padding:10px 0}
.note b.t{display:block}
.note input{width:100%;font-size:16px;min-height:40px;margin-top:6px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;user-select:none;touch-action:none}
.pad button{padding:0;background:rgba(255,255,255,.16);font-size:20px;min-height:0}
.pad button:active,.pad button.down{background:rgba(255,255,255,.35)}
.acts{display:flex;flex-direction:column;gap:8px}
.acts button{min-height:52px;font-size:17px}
.keys{color:#bfe3e6;font-size:13px;margin:0}
.pvw{position:sticky;top:-18px;background:var(--card);padding:6px 0;margin:0 0 6px;z-index:1;display:flex;justify-content:center}
.pvw canvas{width:112px;height:112px;image-rendering:pixelated;background:#efd391;border-radius:12px}
.opt{margin:8px 0}.opt b{display:block;font-size:14px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.sw.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--card) inset}
.tc{min-height:36px;padding:0 10px;font-size:14px;background:transparent;color:var(--ink);border:2px solid var(--line)}
.tc.on{border-color:var(--coral);background:var(--coral);color:#fff}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
@media(max-width:420px){.pad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>보물섬 탈출</h1><p class="sub">중3 · 제곱근과 실수 · 구역 5개</p></div>
  <div class="hud"><span class="pill" id="online" hidden>접속 0</span><span class="pill" id="gates">문 0/5</span><span class="pill" id="timer">00:00</span></div>
</header>
<div class="game" id="game">
  <canvas id="cv"></canvas>
  <button class="prompt" id="prompt">섬을 돌아다니며 단서를 찾아보세요</button>
  <div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
</div>
<div class="ctl">
  <div class="pad" id="pad">
    <span></span><button data-d="up" aria-label="위">▲</button><span></span>
    <button data-d="left" aria-label="왼쪽">◀</button><span></span><button data-d="right" aria-label="오른쪽">▶</button>
    <span></span><button data-d="down" aria-label="아래">▼</button><span></span>
  </div>
  <div class="acts">
    <button class="hot" id="actB">조사하기</button>
    <button id="noteB">수첩 보기</button>
    <button class="alt" id="drawB" style="color:#fff;border-color:rgba(255,255,255,.4)">캐릭터 고치기</button>
    <p class="keys">키보드: 방향키·WASD 이동, 스페이스 조사, N 수첩</p>
  </div>
</div>
</div>
<script src="katex.min.js"></script>

{

[[3,3],[6,3],[10,3],[15,3],[2,6],[7,5],[12,7],[15,5],[3,10],[10,9],[12,11],[16,11],[6,11],[8,2],[13,2],[11,5],[15,8],[7,8],[4,6]].forEach(([x,y])=>g[y][x]='T');

[[19,14],[33,15],[20,21],[28,21],[34,18],[30,13]].forEach(([x,y])=>g[y][x]='R');

const prob=(t)=>`<p>${t}</p>`;
const O=[
 {id:'log',x:3,y:20,k:'book',t:'항해 일지',h:'<p>폭풍에 배가 부서졌다. 이 섬의 <b>앵무새는 언제나 거짓말만</b> 한다. 진짜 단서는 바다가 실어다 준다.</p>'},

 {id:'a5',x:9,y:16,k:'box',s:'■',t:'나무 통',p:1,h:prob('$\\sqrt{12x}$ 가 자연수가 되도록 하는 가장 작은 자연수 $x$ 의 값은?')},
 {id:'bottle',x:15,y:21,k:'bottle',t:'병 속 편지',h:'<p>정글 문의 번호는 <b>◆ ▲ ■ ★ ●</b> 의 답을 차례로 이어 쓴 다섯 자리 수다.<br>— 선장 J</p>'},
 {id:'parrot',x:6,y:17,k:'parrot',t:'앵무새',h:'<p>끼룩! 정글 문 번호는 <b>▲ ● ■ ★ ◆</b> 순서야! 진짜야, 끼룩!</p>'},
 {id:'g1',hash:'b37e5498a0db93bf9ba67c99d192b6b30b6673d6671c9b0b7f52c4889b9d37b6',x:9,y:13,k:'gate1',gate:0,t:'정글 문',h:'<p>덩굴로 엮은 나무 문. 다섯 자리 숫자 자물쇠가 걸려 있다.</p>',hint:'앵무새는 거짓말쟁이예요. 물가를 따라 걸으며 병을 찾아보세요. 그리고 "제곱근 16"과 "16의 제곱근"은 달라요! 12 = 2² × 3 이에요.'},

 {id:'c5',x:27,y:9,k:'crystal',c:'#b04dff',t:'보라 수정',p:1,h:prob('$\\sqrt{18}\\times\\sqrt{a}=12$ 일 때, 자연수 $a$ 의 값은?')},
 {id:'rune',x:27,y:4,k:'rune',t:'벽에 새겨진 글',h:'<p>(빨강의 답 × 파랑의 답) ÷ 초록의 답 + 보라의 답 = 돌문의 번호.<br><b>노란 수정은 저주받았다.</b> 믿지 마라.</p>'},
 {id:'g3',hash:'08f5c28730b2b0bc0b81bc3e98b61465155bbd6eee0b0c5565e48a5abd46a608',x:26,y:12,k:'gate3',gate:2,t:'돌문',h:'<p>숫자를 새겨 넣는 돌판이 있다. 몇 자리인지는 알 수 없다.</p>',hint:'동굴 벽 어딘가에 새겨진 글을 찾으세요. 노란 수정의 답은 쓰지 않아요. 곱셈·나눗셈을 먼저 하고 마지막에 더해요.'},
 {id:'d1',x:21,y:17,k:'skull',t:'해골 (m)',p:1,h:prob('$\\sqrt{12}+\\sqrt{27}=m\\sqrt{3}$ 일 때, $m$ 의 값은?')},

 {id:'d3',x:31,y:17,k:'skull',t:'해골 (k)',p:1,h:prob('$3\\sqrt{2}+5\\sqrt{2}-\\sqrt{2}=k\\sqrt{2}$ 일 때, $k$ 의 값은?')},
 {id:'ghost',x:24,y:19,k:'ghost',t:'유령 선장',h:'<p>크하하, 잘 왔다 꼬마 해적. 해골 바위 뒤 신전 문의 번호는, 해골들의 답을 <b>동쪽(오른쪽) 해골부터</b> 차례로 읽은 수다. 해골이 몇 개였더라… 크하하!</p>'},
 {id:'g4',hash:'10aceaef28281c2128a4468186985da57717045bad5a1d62680eafec814bf995',x:30,y:22,k:'gate3',gate:3,t:'신전 돌문',h:'<p>해골 바위 뒤, 덩굴에 가려진 돌문. 숫자 판이 붙어 있다.</p>',hint:'지도에서 오른쪽이 동쪽이에요. 해골은 모두 4개! 위쪽에 숨어 있는 해골도 찾아보세요.'},

 {id:'tablet2',x:27,y:24,k:'rune',t:'신전 벽화',h:'<p>참된 말을 새긴 석상의 번호를 <b>작은 번호부터</b> 이어 쓰고, 맨 끝에 <b>제단의 답</b>을 붙여라. 그것이 해적왕 보물의 열쇠다.</p>'},

    for(let x=Math.max(0,x0);x<=x1;x++){const o=OM[x+','+y];if(o&&!(o.gate!=null&&o.gate<4&&S.open[o.gate]))obj(o,x*T-camX,y*T-camY,tm)}
    const nOpen=S.open.filter(Boolean).length;
    for(const k in others){const q=others[k];if(Math.round(q.ry)!==y||zoneOf(q.x,q.y)>nOpen)continue;
      const qx=q.rx*T-camX,qy=q.ry*T-camY;if(qx<-T||qy<-T||qx>CW||qy>CH)continue;drawSprite(q.s,qx,qy);label(q.n,qx+T/2,qy-3)}
    if(y===Math.round(ry)){drawSprite(S.sprite||DEFA,rx*T-camX,ry*T-camY+(P.t<1?Math.sin(tm/60)*1.5:0));label(S.team,rx*T-camX+T/2,ry*T-camY-3)}}

async function connect(room,name){
  try{
    const {firebaseConfig:c}=await import('./firebase-config.js');
    if(!c||!c.apiKey||/여기/.test(JSON.stringify(c)))return{err:'config'};
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,AU,FS,RD]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js','firebase-database.js'].map(f=>import(B+f)));
    const app=A.initializeApp(c),auth=AU.getAuth(app);
    const uid=(await AU.signInAnonymously(auth)).user.uid;
    const fs=FS.getFirestore(app),db=RD.getDatabase(app);
    const rs=await FS.getDoc(FS.doc(fs,'escapeRooms',room));
    if(!rs.exists())return{err:'room'};
    const pref=FS.doc(fs,'escapeRooms',room,'players',uid),ps=await FS.getDoc(pref);
    if(!ps.exists())await FS.setDoc(pref,{name,joinedAt:FS.serverTimestamp(),wrong:0,hints:0});
    else await FS.updateDoc(pref,{name});
    const me=RD.ref(db,'presence/'+room+'/'+uid);
    RD.onDisconnect(me).remove();
    const onEl=document.getElementById('online');onEl.hidden=false;
    RD.onValue(RD.ref(db,'presence/'+room),snap=>{const v=snap.val()||{},nx={};let n=0;
      for(const k in v){n++;if(k===uid)continue;const o=v[k];if(!o||typeof o!=='object')continue;const p=others[k],x=+o.x||0,y=+o.y||0;
        nx[k]={x,y,n:'',s:typeof o.s==='string'&&SPR.test(o.s)?o.s:DEFA,rx:p?p.rx:x,ry:p?p.ry:y}}
      others=nx;onEl.textContent='접속 '+n});
    net={on:true,
      gate:i=>FS.updateDoc(pref,{['g'+i]:FS.serverTimestamp()}).catch(()=>{}),
      wrong:()=>FS.updateDoc(pref,{wrong:FS.increment(1)}).catch(()=>{}),
      hint:()=>FS.updateDoc(pref,{hints:FS.increment(1)}).catch(()=>{}),
      pos:full=>{const d={x:P.x,y:P.y,t:RD.serverTimestamp()};if(full){d.s=S.sprite||DEFA}(full?RD.set(me,d):RD.update(me,d)).catch(()=>{})}};

}

  dlg.querySelector('#go').addEventListener('click',()=>{S.sprite=avCode(o);done()});
  upd();
}

const act=()=>{if(modal)return;const n=near();if(n)inspect(n)};
promptB.addEventListener('click',act);document.getElementById('actB').addEventListener('click',act);
document.getElementById('noteB').addEventListener('click',()=>{if(!modal&&S.started)notebook()});
document.getElementById('drawB').addEventListener('click',()=>{if(!modal&&S.started)editor(()=>{save();close();net.pos(true)})});
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape')close();return}
  if(modal){if(e.key==='Escape'&&S.started)close();return}
  if(KM[e.key]){held=KM[e.key];e.preventDefault()}
  else if(e.key===' '||e.key==='Enter'){act();e.preventDefault()}
  else if(e.key==='n'||e.key==='N'){if(S.started)notebook()}});
addEventListener('keyup',e=>{if(KM[e.key]===held)held=null});
document.querySelectorAll('#pad button').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(modal)return;held=d;b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(x){}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(held===d)held=null;b.classList.remove('down')}));
  b.addEventListener('contextmenu',e=>e.preventDefault())});
game.tabIndex=-1;
join();
requestAnimationFrame(frame);
}
</script>
